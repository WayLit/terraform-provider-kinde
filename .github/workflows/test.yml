# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  # No paths-ignore here: Build and generate are required checks, so every PR must run them.
  pull_request:
  # PR branches are covered by pull_request; a second push run would report duplicate required checks.
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    # Building golangci-lint from source takes a few minutes on a cold cache.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      # Acceptance tests skip themselves without TF_ACC, so this runs only the unit tests.
      - run: go test ./...
      # The enterprise Actions allowlist blocks golangci/golangci-lint-action, so install the
      # pinned release with go install (verified against the Go checksum database) instead.
      - name: Run linters
        env:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          GOLANGCI_LINT_VERSION: v2.14.0
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: 'go.mod'
          cache: true
      # Temporarily download Terraform 1.8 prerelease for function documentation support.
      # When Terraform 1.8.0 final is released, this can be removed.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.8.0-alpha20240216'
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Acceptance tests run against an in-memory fake Kinde (internal/kindefake), so they need no secrets.
  acceptance:
    name: Acceptance (${{ matrix.cli }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cli: [terraform, opentofu]
    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform
      TERRAFORM_VERSION: 1.16.5
      # renovate: datasource=github-releases depName=opentofu/opentofu
      TOFU_VERSION: 1.13.1
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: 'go.mod'
          cache: true
      - if: matrix.cli == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # No OpenTofu setup action is on the enterprise allowlist, so download the release and check
      # it against the published checksums.
      - name: Install OpenTofu
        if: matrix.cli == 'opentofu'
        run: |
          base="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSLO "${base}/tofu_${TOFU_VERSION}_SHA256SUMS"
          sha256sum --check --ignore-missing "tofu_${TOFU_VERSION}_SHA256SUMS"
          unzip -q "tofu_${TOFU_VERSION}_linux_amd64.zip" -d tofu
          {
            echo "TF_ACC_TERRAFORM_PATH=${RUNNER_TEMP}/tofu/tofu"
            # OpenTofu resolves unqualified providers on its own registry, so the test provider must claim that host.
            echo "TF_ACC_PROVIDER_HOST=registry.opentofu.org"
          } >> "$GITHUB_ENV"
      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
