# Static security analysis of the GitHub Actions workflows.
name: zizmor

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false
          # Pinned so new audits arrive as Renovate updates instead of failing unrelated PRs.
          version: 1.30.1
