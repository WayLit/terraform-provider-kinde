# Static security analysis of the GitHub Actions workflows.
name: zizmor

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false
          # Pinned so new audits arrive as Renovate updates instead of failing unrelated PRs.
          version: 1.32.0
